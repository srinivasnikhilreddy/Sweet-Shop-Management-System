spring.application.name=UserService
server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}

sweetshop.profile.upload.dir=/home/site/wwwroot/profile-pictures/
sweetshop.profile.default.avatar=/profile-pictures/default.png
sweetshop.sweets.upload.dir=/home/site/wwwroot/sweet-images/
sweetshop.sweets.default.avatar=/sweet-images/default.png

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
